[project]
name = "appliedml-asl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "imagededup>=0.3.3.post2",
    "kaggle>=2.1.2",
    "opencv-python>=4.13.0.92",
    "pre-commit>=4.6.0",
    "scikit-learn>=1.8.0",
    "tensorflow[and-cuda]==2.20.*",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.setuptools.packages.find]
include = ["asl_detector*"]
