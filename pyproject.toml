[project]
name = "appliedml-asl"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "imagededup>=0.3.3.post2",
    "kaggle>=2.1.2",
    "opencv-python<4.13",
    "optuna>=4.8.0",
    "pre-commit>=4.6.0",
    "scikit-learn>=1.8.0",
    "tensorflow==2.16.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.setuptools.packages.find]
include = ["asl_detector*"]
